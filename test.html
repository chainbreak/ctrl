.profile-cover{height:132px;background:linear-gradient(180deg,#0002,#0005),var(--profile-banner,linear-gradient(135deg,var(--cap-side),var(--surface)));background-position:center;background-size:cover}
.profile-identity{display:flex;align-items:center;gap:14px;padding:14px 16px;background:linear-gradient(90deg,#0001,#0000)}
.profile-identity .av{background-color:var(--surface);background-position:center;background-size:cover}
.profile-customization{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.profile-customization .key{flex:1}
.upload-input{display:none}
.wallet-hero{width:100%;min-height:152px;justify-content:space-between;background:radial-gradient(circle at 90% 15%,var(--cap-glow),transparent 40%),linear-gradient(135deg,var(--surface),var(--bg));}
.wallet-amount{display:flex;align-items:center;gap:14px}
.wallet-coin{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(var(--cap-top),var(--cap-side));color:var(--cap-ink);font-weight:800;font-size:23px;box-shadow:0 6px 16px var(--cap-glow)}
.wallet-amount strong{font-size:clamp(28px,5vw,38px);letter-spacing:-.04em}
.wallet-address{max-width:100%;overflow-wrap:anywhere}
.rate-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%}
.rate-item{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--pn2)}
.rate-item b,.rate-item span{display:block}
.rate-item span{color:var(--mu);font-size:13px;margin-top:4px}
@media(max-width:760px){
  .snav{padding:0 2px 6px;gap:8px}
  .snav .chip{flex:none;white-space:nowrap}
  .swipe-hint{display:block}
}
@media(max-width:380px){.gift-grid{gap:6px}.gift-card{padding:6px}.gift-info h2{font-size:12px}.gift-count{font-size:10px}}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;

  if (delta) {
    s = delta / (1 - Math.abs(2 * l - 1));
    if (max === r) h = ((g - b) / delta) % 6;
    else if (max === g) h = (b - r) / delta + 2;

    h = Math.round(h * 60);
    if (h < 0) h += 360;
  }
  return [h, s, l];
}

function localizeDom(root) {
  if (!root || S.language !== 'en') return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    if (node.parentElement?.closest('.m,[data-no-translate]')) continue;
    const original = node.nodeValue.trim();
    const localized = translate(original);
    if (localized !== original) node.nodeValue = node.nodeValue.replace(original, localized);
  }
  root.querySelectorAll('[aria-label],[title],[placeholder],[alt]').forEach(element => {
    ['aria-label', 'title', 'placeholder', 'alt'].forEach(attribute => {
      const value = element.getAttribute(attribute);
      if (value) element.setAttribute(attribute, translate(value));
    });
  });
}

let csrfToken = '';
async function getCsrfToken() {
  if (csrfToken) return csrfToken;
  let response;
  try {
    response = await fetch('/api/auth/csrf', { credentials: 'include', headers: { Accept: 'application/json' } });
  } catch {
    throw new Error(navigator.onLine ? 'Не удалось получить защитный токен.' : 'Нет подключения к интернету.');
  }
  if (!response.ok) throw new Error(`Не удалось получить защитный токен (${response.status}).`);
  const result = await response.json();
  if (typeof result.requestToken !== 'string' || !result.requestToken) {
    throw new Error('Сервер не выдал защитный токен для запроса.');
  }
  csrfToken = result.requestToken;
  return csrfToken;
}
async function apiRequest(path, { method = 'GET', body } = {}) {
  if(CtrlLive.enabled)return CtrlLive.request(path,method,body);
  if (S.previewMode) throw new Error('В режиме предпросмотра запросы к серверу отключены.');
  const headers = { Accept: 'application/json', ...(body === undefined ? {} : { 'Content-Type': 'application/json' }) };
  if (!['GET', 'HEAD', 'OPTIONS'].includes(method.toUpperCase())) {
    headers['X-CSRF-TOKEN'] = await getCsrfToken();
  }
  let response;
  try {
    response = await fetch(`/api${path}`, {
      method,
      credentials: 'include',
      headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    });
  } catch (error) {
    if (path.startsWith('/auth/login') || path === '/auth/logout') csrfToken = '';
    throw new Error(navigator.onLine ? 'Не удалось связаться с сервером.' : 'Нет подключения к интернету.');
  }
  if (path.startsWith('/auth/login') || path === '/auth/logout') csrfToken = '';

  const text = await response.text();
  let data = {};
  if (!response.ok) {
    if ((response.headers.get('content-type') || '').includes('application/json') && text) {
      try { data = JSON.parse(text); }
      catch (error) {
        if (!(error instanceof SyntaxError)) throw error;
      }
    }
    const error = new Error(data && typeof data.message === 'string' ? data.message : `Запрос не выполнен (${response.status}).`);
    error.status = response.status;
    throw error;
  }
  if (text) {
    try { data = JSON.parse(text); }
    catch { throw new Error('Сервер вернул некорректный ответ.'); }
  }
  return data;
}

let ac = null;
function tick() {
  if (!S.sound) return;
  try {
    ac ??= new AudioContext();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(240, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.05);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.connect(g).connect(ac.destination);
    o.start(t);
    o.stop(t + 0.08);
    const b = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.012), ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = ac.createBufferSource(), n = ac.createGain();
    n.gain.value = 0.1;
    s.buffer = b;
    s.connect(n).connect(ac.destination);
    s.start(t);
  } catch { }
}

async function loadGiftAnimation() {
  const container = document.getElementById('gift-animation');
  if (!container || container.dataset.loading) return;
  container.dataset.loading='true';
  try {
    if (!window.lottie) throw new Error('Lottie player did not load.');
    if (!('DecompressionStream' in window)) throw new Error('Gzip decompression is unavailable.');
    const response = await fetch('./assets/gifts/first-gift/animation.tgs');
    if (!response.ok) throw new Error(`TGS request failed with status ${response.status}.`);
    const compressedData = await response.arrayBuffer();
    const stream = new Blob([compressedData]).stream().pipeThrough(new DecompressionStream('gzip'));
    const animationData = await new Response(stream).json();
    if (!container.isConnected) return;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    giftAnimation = window.lottie.loadAnimation({
      container,
      renderer: 'svg',
      loop: !reducedMotion,
      autoplay: !reducedMotion,
      animationData
    });
    if (reducedMotion) {
      giftAnimation.addEventListener('DOMLoaded', () => giftAnimation.goToAndStop(0, true), { once: true });
    }
  } catch (error) {
    if (!container.isConnected) return;
    console.error('Unable to load the CTRL gift animation.', error);
    container.textContent = 'Анимация подарка не загрузилась.';
    container.classList.add('gift-error');
    toast('Не удалось загрузить анимацию подарка.');
  }
}

async function normalizeImage(file) {
  if (!file || !['image/png', 'image/jpeg', 'image/webp'].includes(file.type)) {
    throw new Error('Поддерживаются только PNG, JPEG и WebP.');
  }
  if (file.size > 10 * 1024 * 1024) throw new Error('Размер изображения должен быть не больше 10 МБ.');
  let bitmap;
  try {
    bitmap = await createImageBitmap(file);
  } catch (error) {
    throw new Error('Браузер не смог открыть это изображение.');
  }
  try {
    const scale = Math.min(1, 512 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    const context = canvas.getContext('2d', { willReadFrequently: true });
    if (!context) throw new Error('Браузер не смог обработать изображение.');
    context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
    let red = 0, green = 0, blue = 0, count = 0;
    for (let index = 0; index < pixels.length; index += 4) {
      if (pixels[index + 3] < 48) continue;
      red += pixels[index]; green += pixels[index + 1]; blue += pixels[index + 2]; count++;
    }
    if (!count) throw new Error('В изображении нет видимых пикселей.');
    const hex = `#${[red, green, blue].map(channel => Math.round(channel / count).toString(16).padStart(2, '0')).join('')}`;
    const data = canvas.toDataURL('image/webp', 0.78);
    if (data.length > 1200000) throw new Error('Оптимизированное изображение превышает допустимый размер.');
    return { data, color: hex };
  } finally {
    bitmap.close();
  }
}

    const f = document.getElementById('pfill'), p = document.getElementById('ppos');
    if (f) f.style.width = `${(S.pos / d) * 100}%`;
    if (p) p.textContent = mmss(S.pos);
  }, 1000);
  render();
}
